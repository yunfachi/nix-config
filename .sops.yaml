keys:
  - &dekomori 
  - &jakuzure 
  - &mitama 
creation_rules:
  - path_regex: ^secrets.yaml$
    key_groups:
    - age:
      - *dekomori
      - *jakuzure
      - *mitama
  - path_regex: ^hosts/dekomori/secrets.yaml$
    key_groups:
    - age:
      - *dekomori
  - path_regex: ^hosts/jakuzure/secrets.yaml$
    key_groups:
    - age:
      - *jakuzure
  - path_regex: ^hosts/mitama/secrets.yaml$
    key_groups:
    - age:
      - *mitama